name: X自動投稿

on:
  # 自動投稿は無効化中（再開するには schedule ブロックを復元してください）
  # 手動実行ボタン（テスト用）
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run（確認のみ、実際には投稿しない）'
        required: false
        default: 'false'

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # queue.jsonの変更をpushするために必要

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: |
          pip install tweepy python-dotenv google-genai

      - name: キューから投稿
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          if [ "$DRY_RUN" = "true" ]; then
            python skills/note-to-x/scripts/dequeue_post.py --dry-run
          else
            python skills/note-to-x/scripts/dequeue_post.py
          fi

      - name: キューの変更をコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue/queue.json queue/posted_ids.json queue/images/ 2>/dev/null || true
          # 変更がある場合のみコミット
          if git diff --staged --quiet; then
            echo "変更なし。コミットをスキップ。"
          else
            git commit -m "chore: 投稿済みアイテムをキューから削除 [skip ci]"
            # push失敗時はエラーを明示してジョブを失敗扱いにする
            git push || { echo "❌ git push 失敗。次回実行時の重複投稿は posted_ids.json で防止されます。"; exit 1; }
          fi
